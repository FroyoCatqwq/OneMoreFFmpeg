name: quality-e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_remote_linux:
        description: "Also run e2e on the configured Linux server"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.x"
  PYTHON_VERSION: "3.14"
  # Pinned so a bats-core supply-chain change cannot silently alter CI.
  BATS_REF: "v1.14.0"

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt (must be clean)
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (includes gosec)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: go test (unit + contract freeze)
        run: go test -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: fuzz smoke (URL/parser/input guards)
        run: |
          go test ./internal/capabilities -run='^$' -fuzz=FuzzParseList -fuzztime=20s
          go test ./internal/capabilities -run='^$' -fuzz=FuzzParseVersion -fuzztime=20s
          go test ./internal/contracts -run='^$' -fuzz=FuzzIsHTTPS -fuzztime=20s
          go test ./internal/contracts -run='^$' -fuzz=FuzzSafeAssetName -fuzztime=20s
          go test ./internal/cli -run='^$' -fuzz=FuzzNormalizeJSONInput -fuzztime=20s

  e2e:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist/one-more-ffmpeg-windows-amd64.exe
            goos: windows
          - os: ubuntu-latest
            binary: dist/one-more-ffmpeg-linux-amd64
            goos: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: astral-sh/setup-uv@v6
      - uses: jdx/mise-action@v2

      - name: Build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o "${{ matrix.binary }}" ./cmd/one-more-ffmpeg

      - name: pytest e2e (full suite)
        shell: bash
        env:
          OMF_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: >-
          uv run --python ${{ env.PYTHON_VERSION }} --with-requirements tests/e2e/requirements.txt
          pytest -n auto --timeout=180 -v
          --junitxml=tests/e2e/results/pytest-junit.xml
          tests/e2e/test_cli_e2e.py tests/e2e/test_cli_full_e2e.py tests/e2e/test_env_real_e2e.py tests/e2e/test_real_network_e2e.py

      - name: Windows real HKCU env e2e
        if: runner.os == 'Windows'
        shell: bash
        env:
          OMF_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
          OMF_E2E_REAL_ENV: "1"
        run: >-
          uv run --python ${{ env.PYTHON_VERSION }} --with-requirements tests/e2e/requirements.txt
          pytest --timeout=180 -v tests/e2e/test_env_real_e2e.py tests/e2e/test_real_network_e2e.py::test_env_apply_writes_and_rolls_back_registry

      - name: Robot Framework e2e
        shell: bash
        env:
          OMF_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: >-
          uv run --python ${{ env.PYTHON_VERSION }} --with-requirements tests/e2e/requirements.txt
          robot --outputdir tests/e2e/results/robot tests/e2e/robot

      - name: Bats e2e (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          OMF_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: |
          git clone --depth 1 --branch "$BATS_REF" https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          "$RUNNER_TEMP/bats-core/bin/bats" tests/e2e/bats

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: tests/e2e/results
          if-no-files-found: ignore

  linux-server:
    name: configured Linux server
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.run_remote_linux
    env:
      OMF_LINUX_SERVER_INFO_B64: ${{ secrets.OMF_LINUX_SERVER_INFO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - name: Deploy and run e2e on the configured Linux server
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          if [ -z "$OMF_LINUX_SERVER_INFO_B64" ]; then
            echo "OMF_LINUX_SERVER_INFO secret is required for linux-server e2e" >&2
            exit 1
          fi
          echo "$OMF_LINUX_SERVER_INFO_B64" | base64 -d > "$RUNNER_TEMP/Linux-Server-Info.txt"
          export OMF_LINUX_SERVER_INFO="$RUNNER_TEMP/Linux-Server-Info.txt"
          mkdir -p dist
          go build -trimpath -o dist/one-more-ffmpeg-linux-amd64 ./cmd/one-more-ffmpeg
          uv run --python ${{ env.PYTHON_VERSION }} --with-requirements tests/e2e/requirements.txt \
            python tests/e2e/remote_linux.py all
