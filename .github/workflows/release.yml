name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.1.2)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.x"

jobs:
  release:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version from ref
        id: version
        shell: bash
        run: |
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # SemVer: X.Y.Z or X.Y.Z-preN (prerelease). Reject 1..0 / 1.0. / v-pre.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid semver version: $version (expected X.Y.Z or X.Y.Z-preN)" >&2
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify release notes exist
        shell: bash
        run: |
          notes="docs/releases/release-${{ steps.version.outputs.tag }}.md"
          [ -f "$notes" ] || { echo "missing $notes; add release notes before tagging" >&2; exit 1; }

      - name: Pre-release quality gate
        shell: bash
        run: |
          set -e
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          [ -z "$unformatted" ] || { echo "gofmt needed:" >&2; echo "$unformatted" >&2; exit 1; }
          go vet ./...
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...
          go test -count=1 ./...
          go test ./internal/capabilities -run='^$' -fuzz=FuzzParseList -fuzztime=10s
          go test ./internal/contracts -run='^$' -fuzz=FuzzSafeAssetName -fuzztime=10s
          go test ./internal/cli -run='^$' -fuzz=FuzzNormalizeJSONInput -fuzztime=10s

      - name: Build release binaries
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="$(git rev-parse HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILT}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/one-more-ffmpeg-v${VERSION}-windows-amd64.exe" ./cmd/one-more-ffmpeg
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/one-more-ffmpeg-v${VERSION}-linux-amd64" ./cmd/one-more-ffmpeg

      - name: Guard - only the two CLI binaries may be published
        shell: bash
        run: |
          allowed_re='^one-more-ffmpeg-v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?-windows-amd64\.exe$|^one-more-ffmpeg-v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.-]+)?-linux-amd64$'
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            echo "$f" | grep -Eq "$allowed_re" || { echo "unexpected asset: $f" >&2; exit 1; }
          done < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "$count" -eq 2 ] || { echo "expected exactly 2 release binaries, found $count" >&2; exit 1; }
          file dist/*.exe | grep -q 'PE32' || { echo "missing Windows PE binary" >&2; exit 1; }
          file dist/one-more-ffmpeg-v*-linux-amd64 | grep -q 'ELF' || { echo "missing Linux ELF binary" >&2; exit 1; }

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum one-more-ffmpeg-v*-windows-amd64.exe one-more-ffmpeg-v*-linux-amd64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/one-more-ffmpeg-v*-*,dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="docs/releases/release-${tag}.md"
          prerelease_flag=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$tag" \
            --title "OneMoreFFmpeg ${tag}" \
            --notes-file "$notes" \
            --verify-tag \
            $prerelease_flag \
            dist/one-more-ffmpeg-v*-windows-amd64.exe \
            dist/one-more-ffmpeg-v*-linux-amd64 \
            dist/SHA256SUMS.txt
