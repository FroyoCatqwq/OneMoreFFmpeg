[tools]
python = "3.14"
go = "1.27"

[env]
OMF_E2E_PYTHON = "3.14"

[tasks."e2e-pytest"]
description = "Run cross-platform CLI e2e tests with pytest/asyncio"
run = "uv run --python 3.14 --with-requirements tests/e2e/requirements.txt pytest -n auto --timeout=180 tests/e2e/test_cli_e2e.py tests/e2e/test_cli_full_e2e.py tests/e2e/test_env_real_e2e.py tests/e2e/test_real_network_e2e.py"

[tasks."e2e-robot"]
description = "Run Robot Framework smoke suite"
run = "uv run --python 3.14 --with-requirements tests/e2e/requirements.txt robot --outputdir tests/e2e/results/robot tests/e2e/robot"

[tasks."e2e-bats"]
description = "Run Bats smoke suite (requires bats-core on PATH)"
run = "bats tests/e2e/bats"

[tasks."e2e-linux-server"]
description = "Deploy and run Linux e2e on the configured server"
run = "uv run --python 3.14 --with-requirements tests/e2e/requirements.txt python tests/e2e/remote_linux.py all"

[tasks."e2e-all"]
description = "Run the default cross-platform e2e suites (pytest + Robot). Bats needs bats-core and e2e-linux-server needs a configured server; run those separately."
depends = ["e2e-pytest", "e2e-robot"]

[tasks.fuzz]
description = "Short fuzz smoke across parsers/URL and input guards"
run = """
go test ./internal/capabilities -run='^$' -fuzz=FuzzParseList -fuzztime=20s
go test ./internal/capabilities -run='^$' -fuzz=FuzzParseVersion -fuzztime=20s
go test ./internal/contracts -run='^$' -fuzz=FuzzIsHTTPS -fuzztime=20s
go test ./internal/contracts -run='^$' -fuzz=FuzzSafeAssetName -fuzztime=20s
go test ./internal/cli -run='^$' -fuzz=FuzzNormalizeJSONInput -fuzztime=20s
"""

[tasks."lint"]
description = "golangci-lint v2 (includes gosec) + standalone gosec scan"
run = """
go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
golangci-lint run ./...
"""

[tasks.quality]
description = "go vet + golangci-lint/gosec + go test + fuzz smoke (run 'gofmt -w .' first; gofmt gate is enforced in CI)"
depends = ["fuzz"]
run = """
go vet ./...
go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
golangci-lint run ./...
go test -count=1 ./...
"""
